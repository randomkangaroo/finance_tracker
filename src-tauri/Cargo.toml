[package]
name = "finance_tracker"
version = "0.1.0"
description = "An app to help track personal finances"
authors = ["Thomas Moulton"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "finance_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
# tauri, specta, specta-typescript and tauri-specta are pinned exactly: specta and
# tauri-specta are release candidates whose APIs change between RCs, and they must
# stay in lockstep with each other. See the README before bumping any of them.
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
thiserror = "2.0.21"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
